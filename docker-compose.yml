services:
  sendportal-db:
    image: postgres:15-alpine
    container_name: sendportal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sendportal
      POSTGRES_PASSWORD: sendportalpass
      POSTGRES_DB: sendportal
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=1024MB
      - -c
      - effective_cache_size=3072MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=16MB
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sendportal -d sendportal"]
      interval: 5s
      timeout: 5s
      retries: 5

  sendportal-redis:
    image: redis:7-alpine
    container_name: sendportal-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru

  sendportal-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sendportal:local
    container_name: sendportal-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      sendportal-db:
        condition: service_healthy
      sendportal-redis:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./.env:/var/www/sendportal/.env
      - ./data/storage:/var/www/sendportal/storage/app
      - ./app/Adapters:/var/www/sendportal/app/Adapters
      - ./app/Providers/AppServiceProvider.php:/var/www/sendportal/app/Providers/AppServiceProvider.php
      - ./app/Http/Middleware/LocaleMiddleware.php:/var/www/sendportal/app/Http/Middleware/LocaleMiddleware.php
      - ./config/app.php:/var/www/sendportal/config/app.php
      - ./resources/views/vendor/sendportal:/var/www/sendportal/resources/views/vendor/sendportal
      - ./resources/views/layouts:/var/www/sendportal/resources/views/layouts
      - ./lang:/var/www/sendportal/lang
      - ./public/css:/var/www/sendportal/public/css
      - ./public/js:/var/www/sendportal/public/js
      - ./public/images:/var/www/sendportal/public/images
      - ./app/Services/TotpService.php:/var/www/sendportal/app/Services/TotpService.php
      - ./app/Http/Controllers/Auth/TwoFactorController.php:/var/www/sendportal/app/Http/Controllers/Auth/TwoFactorController.php
      - ./app/Http/Controllers/Auth/LoginController.php:/var/www/sendportal/app/Http/Controllers/Auth/LoginController.php
      - ./resources/views/auth/two_factor.blade.php:/var/www/sendportal/resources/views/auth/two_factor.blade.php
      - ./routes/web.php:/var/www/sendportal/routes/web.php
      - ./database/migrations/2026_09_08_000000_add_two_factor_to_users_table.php:/var/www/sendportal/database/migrations/2026_09_08_000000_add_two_factor_to_users_table.php
    extra_hosts:
      - "host.docker.internal:host-gateway"
